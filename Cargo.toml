[package]
name = "inkflow"
version = "0.2.0"
edition = "2021"
description = "Self-iterating generative ambience: local LLM text-stream + particles, shaped by touch. Zero-dep std-only build: DRM/KMS dumb-buffer + evdev raw ioctl + hand-written ollama HTTP/1.1 + embedded CJK bitmap font."

# Hard contract: zero third-party crates. All ioctl / syscalls / net / JSON /
# font extraction done by hand. See src/sys.rs for the extern "C" syscall
# surface that replaces libc.
[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"